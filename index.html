<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess the Job — Work Collocations</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(145deg, #eef2f7 0%, #d9e2f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    .app {
      background: #ffffff;
      max-width: 800px;
      width: 100%;
      border-radius: 32px;
      padding: 28px 32px 32px;
      box-shadow: 0 20px 40px rgba(0, 20, 50, 0.15), 0 8px 20px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      transition: all 0.2s;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a2b4c;
      letter-spacing: -0.3px;
    }

    .progress {
      font-size: 14px;
      font-weight: 700;
      color: #7a89ad;
      background: #eef2fb;
      border-radius: 999px;
      padding: 5px 16px;
    }

    .score {
      font-size: 15px;
      font-weight: 700;
      color: #1e3c72;
      background: #e6eeff;
      padding: 5px 18px;
      border-radius: 999px;
    }

    .description-box {
      background: #f8f9fc;
      border-left: 4px solid #2a5298;
      border-radius: 12px;
      padding: 22px 26px;
      margin-bottom: 20px;
      font-size: 18px;
      line-height: 1.65;
      color: #1e2c44;
      font-weight: 500;
      min-height: 140px;
    }

    .description-box .highlight {
      color: #1e3c72;
      font-weight: 700;
      background: #e6eeff;
      padding: 1px 6px;
      border-radius: 6px;
    }

    .input-area {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .job-input {
      flex: 1;
      font: inherit;
      font-size: 18px;
      font-weight: 500;
      color: #1e2c44;
      padding: 14px 18px;
      border: 2px solid #d0ddef;
      border-radius: 16px;
      background: #fafcff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-width: 200px;
    }

    .job-input:focus {
      border-color: #2a5298;
      box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.12);
      background: #fff;
    }

    .job-input.correct {
      border-color: #22a35a;
      background: #f2fcf6;
    }

    .job-input.incorrect {
      border-color: #e04050;
      background: #fef5f6;
    }

    .btn {
      font: inherit;
      font-weight: 700;
      font-size: 16px;
      padding: 12px 28px;
      border-radius: 60px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.18s ease;
      background: #eef2f9;
      color: #1e2c44;
      min-width: 110px;
      user-select: none;
    }

    .btn:hover {
      background: #e0e7f3;
      transform: translateY(-1px);
    }

    .btn.primary {
      background: linear-gradient(135deg, #2a5298, #1e3c72);
      color: #fff;
      box-shadow: 0 12px 24px -8px rgba(30, 60, 114, 0.4);
    }

    .btn.primary:hover {
      filter: brightness(1.1);
      box-shadow: 0 16px 28px -8px rgba(30, 60, 114, 0.5);
    }

    .btn:disabled {
      opacity: 0.35;
      pointer-events: none;
      transform: none;
    }

    .feedback {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 18px;
      min-height: 28px;
      color: #6b7a99;
    }

    .feedback.good {
      color: #1a8f4d;
    }

    .feedback.bad {
      color: #c92b3d;
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .finish-screen {
      text-align: center;
      padding: 40px 20px;
    }

    .finish-screen .emoji {
      font-size: 64px;
      line-height: 1;
    }

    .finish-screen h2 {
      color: #1e3c72;
      margin: 16px 0 8px;
      font-size: 28px;
    }

    .finish-screen p {
      font-size: 20px;
      color: #2c3e5c;
      margin-bottom: 24px;
    }

    @media (max-width: 600px) {
      .app {
        padding: 20px 18px 24px;
        border-radius: 24px;
      }
      .header h1 {
        font-size: 18px;
      }
      .description-box {
        font-size: 16px;
        padding: 16px 18px;
      }
      .job-input {
        font-size: 16px;
        padding: 12px 14px;
      }
      .btn {
        font-size: 14px;
        padding: 10px 18px;
        min-width: 90px;
      }
    }
  </style>
</head>
<body>

<div class="app" id="app">
  <div class="header">
    <h1>🕵️ Guess the Job</h1>
    <span class="progress" id="progress">1 / 8</span>
    <span class="score" id="scoreDisplay">Score: 0</span>
  </div>

  <div class="description-box" id="descriptionBox"></div>

  <div class="input-area">
    <input type="text" id="jobInput" class="job-input" placeholder="Type the job here..." autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>

  <div class="feedback" id="feedback"></div>

  <div class="controls">
    <button class="btn primary" id="checkBtn">Check</button>
    <button class="btn primary" id="nextBtn" style="display:none;">Next →</button>
  </div>
</div>

<script>
  (function() {
    // ------------------------------------------------------------
    // Job descriptions using pre-intermediate collocations
    // ------------------------------------------------------------
    const jobs = [
      {
        description: "I <span class='highlight'>work as part of a team</span>. I <span class='highlight'>care for sick people</span>. I <span class='highlight'>give medicine to patients</span>. I sometimes <span class='highlight'>work at night</span>.",
        answers: ["nurse", "a nurse", "male nurse", "nurses"]
      },
      {
        description: "I <span class='highlight'>work alone</span> or in a team. I <span class='highlight'>do research</span>. I <span class='highlight'>solve problems</span>. I <span class='highlight'>study hard</span> and <span class='highlight'>learn new skills</span>. I sometimes <span class='highlight'>attend conferences</span>.",
        answers: ["scientist", "a scientist", "researcher", "a researcher"]
      },
      {
        description: "I <span class='highlight'>investigate crime</span>. I <span class='highlight'>respond to emergencies</span>. I <span class='highlight'>control traffic</span>. I <span class='highlight'>work long hours</span> and sometimes <span class='highlight'>work at night</span>.",
        answers: ["police officer", "police officer", "policeman", "policewoman", "cop", "a police officer", "police"]
      },
      {
        description: "I <span class='highlight'>fly planes</span>. I <span class='highlight'>do a training course</span>. I <span class='highlight'>work away from home</span>. I sometimes <span class='highlight'>work at night</span>.",
        answers: ["pilot", "a pilot", "pilots"]
      },
      {
        description: "I <span class='highlight'>write news stories</span>. I <span class='highlight'>gather information</span>. I <span class='highlight'>always know the latest news</span>. I sometimes <span class='highlight'>work long hours</span>.",
        answers: ["journalist", "a journalist", "reporter", "a reporter", "news reporter"]
      },
      {
        description: "I <span class='highlight'>run a team</span>. I <span class='highlight'>motivate the team</span>. I <span class='highlight'>give customers what they want</span>. I <span class='highlight'>work as part of a team</span>.",
        answers: ["sales manager", "a sales manager", "manager", "a manager", "sales director"]
      },
      {
        description: "I <span class='highlight'>fight in wars</span>. I <span class='highlight'>keep fit</span>. I do <span class='highlight'>rescue work</span>. I <span class='highlight'>learn new skills</span>.",
        answers: ["soldier", "a soldier", "soldiers", "army soldier"]
      },
      {
        description: "I <span class='highlight'>run a company</span>. I <span class='highlight'>do research</span>. I <span class='highlight'>solve problems</span>. I <span class='highlight'>work long hours</span>.",
        answers: ["business owner", "a business owner", "entrepreneur", "a entrepreneur", "company owner", "businessman", "businesswoman", "director", "ceo"]
      }
    ];

    // ------------------------------------------------------------
    // State
    // ------------------------------------------------------------
    let currentIndex = 0;
    let score = 0;
    let checked = false;

    const app = document.getElementById('app');
    const progressEl = document.getElementById('progress');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const descriptionBox = document.getElementById('descriptionBox');
    const jobInput = document.getElementById('jobInput');
    const feedbackEl = document.getElementById('feedback');
    const checkBtn = document.getElementById('checkBtn');
    const nextBtn = document.getElementById('nextBtn');

    // ------------------------------------------------------------
    // Normalize answer (case-insensitive, remove articles, spaces)
    // ------------------------------------------------------------
    function normalize(str) {
      let s = str.toLowerCase().trim();
      // Remove leading "a ", "an ", "the "
      s = s.replace(/^(a|an|the)\s+/, '');
      // Remove punctuation
      s = s.replace(/[.,!?;:]/g, '');
      // Collapse spaces
      s = s.replace(/\s+/g, ' ');
      return s;
    }

    // ------------------------------------------------------------
    // Render
    // ------------------------------------------------------------
    function render() {
      checked = false;
      const job = jobs[currentIndex];
      progressEl.textContent = (currentIndex + 1) + ' / ' + jobs.length;
      scoreDisplay.textContent = 'Score: ' + score;
      descriptionBox.innerHTML = job.description;
      jobInput.value = '';
      jobInput.readOnly = false;
      jobInput.classList.remove('correct', 'incorrect');
      feedbackEl.textContent = '';
      feedbackEl.className = 'feedback';
      checkBtn.style.display = '';
      checkBtn.disabled = false;
      nextBtn.style.display = 'none';
      nextBtn.textContent = currentIndex === jobs.length - 1 ? 'Finish' : 'Next →';
      jobInput.focus();
    }

    // ------------------------------------------------------------
    // Check answer
    // ------------------------------------------------------------
    function check() {
      if (checked) return;
      checked = true;

      const job = jobs[currentIndex];
      const userAnswer = jobInput.value.trim();
      const normalizedUser = normalize(userAnswer);

      if (normalizedUser === '') {
        feedbackEl.textContent = 'Please type an answer.';
        feedbackEl.className = 'feedback bad';
        checked = false;
        return;
      }

      // Check against all acceptable answers
      const isCorrect = job.answers.some(ans => normalize(ans) === normalizedUser);

      if (isCorrect) {
        score++;
        feedbackEl.textContent = '✓ Correct! It\'s a ' + job.answers[0] + '.';
        feedbackEl.className = 'feedback good';
        jobInput.classList.add('correct');
      } else {
        feedbackEl.innerHTML = `✗ Not quite. The correct answer is: <strong>${job.answers[0]}</strong>`;
        feedbackEl.className = 'feedback bad';
        jobInput.classList.add('incorrect');
      }

      scoreDisplay.textContent = 'Score: ' + score;
      jobInput.readOnly = true;
      checkBtn.style.display = 'none';
      nextBtn.style.display = '';
    }

    // ------------------------------------------------------------
    // Next
    // ------------------------------------------------------------
    function next() {
      if (currentIndex < jobs.length - 1) {
        currentIndex++;
        render();
      } else {
        finish();
      }
    }

    // ------------------------------------------------------------
    // Finish
    // ------------------------------------------------------------
    function finish() {
      app.innerHTML = `
        <div class="finish-screen">
          <div class="emoji">🎉</div>
          <h2>Great job!</h2>
          <p>Your score: <strong>${score} / ${jobs.length}</strong></p>
          <button class="btn primary" id="restartBtn">Try again</button>
        </div>
      `;
      document.getElementById('restartBtn').addEventListener('click', () => {
        location.reload();
      });
    }

    // ------------------------------------------------------------
    // Event listeners
    // ------------------------------------------------------------
    checkBtn.addEventListener('click', check);
    nextBtn.addEventListener('click', next);

    jobInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (checked) {
          next();
        } else {
          check();
        }
      }
    });

    // ------------------------------------------------------------
    // Init
    // ------------------------------------------------------------
    render();
  })();
</script>

</body>
</html>
